name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Run CMake Release Workflow
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    env:
      CC:  clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - name: Install Dependencies
        if: ${{ runner.os == 'Linux' }}
        # from https://wiki.libsdl.org/SDL3/README-linux#build-dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config libasound2-dev libpulse-dev \
          libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
          libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev \
          libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev

      - name: Run Workflow Release
        run: cmake --workflow --preset release
      - name: Install
        run: cmake --install build/release --prefix dist --component chip8emu
      - name: Build Archive
        run: tar -czf ${{ github.event.repository.name }}-${{ matrix.target }}-${{ github.ref_name }}.tar.gz dist
      - uses: actions/upload-artifact@v7
        with:
          name: '${{ github.event.repository.name }}-${{ matrix.target }}-${{ github.ref_name }}'
          path: ./${{ github.event.repository.name }}-${{ matrix.target }}-${{ github.ref_name }}.tar.gz
  release:
    name: Create Release
    env:
      GH_TOKEN: ${{ github.token }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - name: Download a Build Artifact
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
          merge-multiple: 'true'

      - name: Create Release
        run: gh release create ${{ github.ref_name }} artifacts/*.tar.gz --generate-notes