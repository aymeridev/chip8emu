name: CI
on:
  push:
  pull_request:

jobs:
  build:
    name: Run CMake Debug Workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update && apt-get install -y libx11-dev libxext-dev
      - run: cmake --workflow --preset debug -DSDL_UNIX_CONSOLE_BUILD=ON