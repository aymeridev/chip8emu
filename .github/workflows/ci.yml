name: CI
on:
  push:
  pull_request:

jobs:
  build:
    name: Run CMake Debug Workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # from https://wiki.libsdl.org/SDL3/README-linux#build-dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config ninja-build \
          gnome-desktop-testing libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
          libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev \
          libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev
      - name: Run Workflow & Tests
        run: cmake --workflow --preset debug