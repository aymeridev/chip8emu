name: CI
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Run CMake Debug Workflow
    strategy:
      matrix:
        compilers: [
          { os: 'ubuntu-latest', cc: 'gcc', cxx: 'g++' },
          { os: 'ubuntu-latest', cc: 'clang', cxx: 'clang++' },
          { os: 'macos-latest', cc: 'clang', cxx: 'clang++' },
        ]
    runs-on: ${{ matrix.compilers.os }}
    env:
      CC:  ${{ matrix.compilers.cc }}
      CXX: ${{ matrix.compilers.cxx }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Dependencies
        if: ${{ runner.os == 'Linux' }}
        # from https://wiki.libsdl.org/SDL3/README-linux#build-dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config libasound2-dev libpulse-dev \
          libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
          libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev \
          libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev

      - name: Run Workflow & Tests
        run: cmake --workflow --preset debug
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      CC:  'gcc'
      CXX: 'g++'
    steps:
      - uses: actions/checkout@v7
      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config libasound2-dev libpulse-dev \
          libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
          libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev \
          libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev
      - name: Install gcovr
        run: pipx install gcovr

      - name: Run Workflow
        run: cmake --workflow --preset coverage

      - name: Run gcovr
        run: gcovr --root . --filter src/ --cobertura coverage.xml --print-summary build/coverage
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true